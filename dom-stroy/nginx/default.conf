proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=img:50m max_size=2g inactive=30d;

upstream app { server app:3000; }
upstream minio { server minio:9000; }

server { listen 80 default_server; return 301 https://$host$request_uri; }

# Картинки из MinIO: img.dom-stroy.by (в бакете public-read: media)
server {
  listen 443 ssl; http2 on;
  server_name img.dom-stroy.by;
  ssl_certificate     /etc/letsencrypt/live/dom-stroy.by/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dom-stroy.by/privkey.pem;
  location / {
    proxy_pass http://minio/media/;
    proxy_set_header Host minio:9000;
    proxy_cache img; proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}

# Основной домен и все города (wildcard)
server {
  listen 443 ssl default_server; http2 on;
  server_name dom-stroy.by *.dom-stroy.by;
  ssl_certificate     /etc/letsencrypt/live/dom-stroy.by/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dom-stroy.by/privkey.pem;
  client_max_body_size 10m;
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://app; proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    proxy_pass http://app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
